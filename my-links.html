<title>EL FARES STORE</title>
<style>
:root{--gold:#4EEDF3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:26px 16px 34px;background:radial-gradient(ellipse at 50% 12%,#18232b 0,#080b10 48%,#05070a 100%);color:#f7f7f7;font-family:Arial,Tahoma,sans-serif;text-align:center}
.page{width:min(100%,620px);margin:auto}
.logo-circle{width:178px;height:178px;margin:0 auto 14px;border:4px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#05080b;box-shadow:0 0 18px #4EEDF388,0 0 42px #4EEDF333}
.logo-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
h1{margin:8px 0 12px;color:var(--gold);font-size:clamp(30px,7vw,48px);font-weight:800;letter-spacing:1px}
.title-line{height:3px;width:72%;margin:0 auto 18px;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 12px var(--gold)}
.tagline{font-size:clamp(18px,4.5vw,25px);line-height:1.7;margin:0 auto 28px}
.links{display:grid;gap:14px}
.link{min-height:76px;padding:14px 22px;border:3px solid var(--gold);border-radius:26px;background:linear-gradient(110deg,#101820,#071014);color:white;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:18px;font-size:clamp(21px,5vw,29px);font-weight:700;box-shadow:inset 0 0 18px #4EEDF30B,0 0 10px #4EEDF322;transition:.18s}
.link:hover{background:#17232a;transform:translateY(-2px);box-shadow:0 0 18px #4EEDF355}
.icon{width:42px;height:42px;flex:0 0 42px;display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:100%;height:100%;display:block}
.bottom-logo{width:min(82%,360px);margin:42px auto 0;padding:18px;border:2px solid #aeb4b8;border-radius:48px;background:linear-gradient(145deg,#101820,#05080b);box-shadow:0 0 18px #4EEDF355;overflow:hidden}
.bottom-logo img{display:block;width:100%;height:auto;border-radius:24px}
@media(max-width:380px){.logo-circle{width:150px;height:150px}.link{min-height:68px;border-radius:20px}}
</style>
